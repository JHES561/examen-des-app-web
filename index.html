<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>examen-des-app-web</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Solo variables personalizadas para paleta y tipografía -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bs-primary: #8B1A1A;
        --bs-primary-rgb: 139, 26, 26;
        --bs-body-font-family: 'Inter', sans-serif;
        --bs-border-radius: 0.75rem;
      }
      .btn-primary { background-color: #8B1A1A; border-color: #8B1A1A; }
      .btn-primary:hover { background-color: #6e1515; border-color: #6e1515; }
      .text-primary { color: #8B1A1A !important; }
      .border-primary { border-color: #8B1A1A !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Evita warning ARIA: si un modal oculto aún contiene el foco, lo quitamos
      document.addEventListener('hidden.bs.modal', (e) => {
        try {
          const active = document.activeElement;
          if (active && e.target.contains(active)) {
            if (typeof active.blur === 'function') active.blur();
          }
        } catch (err) {
          // no-op
        }
      });
    </script>
  </body>
</html>
